name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r fingerprint-verifier/requirements.txt
      - name: Run tests
        run: |
          cd fingerprint-verifier
          py -3 -m pytest -q
      - name: Build Docker image
        run: |
          cd fingerprint-verifier
          docker build -t fingerprint-verifier:ci .
