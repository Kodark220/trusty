version: '3.8'
services:
  verifier:
    build: .
    ports:
      - "8001:8001"
    environment:
      - PINATA_JWT=${PINATA_JWT}
      - GENLAYER_RPC_URL=${GENLAYER_RPC_URL}
      - GENLAYER_PRIVATE_KEY=${GENLAYER_PRIVATE_KEY}
    volumes:
      - ./:/app
  demo_agent:
    image: python:3.10-slim
    command: ["/bin/sh","-c","pip install fastapi uvicorn && python demo_agents/demo_agent.py"]
    ports:
      - "9001:9001"
    volumes:
      - ./:/app
    working_dir: /app
